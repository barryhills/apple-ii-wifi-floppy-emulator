<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple II WiFi Disk Manager</title>
<style>
:root{--bg:#f6f6f3;--fg:#1d1d1f;--mut:#6e6e73;--card:#fff;--line:#e2e2de;--sel:#eef2fb;--acc:#1d1d1f;--ok:#1a7f37;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#161617;--fg:#f2f2f2;--mut:#9a9aa0;--card:#1f1f21;--line:#333336;--sel:#2a2f3a;--acc:#f2f2f2;--ok:#3fb950;--bad:#ff6b6b}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,system-ui,sans-serif;margin:0;padding:24px 16px}
main{max-width:640px;margin:0 auto}
h1{font-size:20px;margin:0 0 16px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 10px;font-weight:600}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
#list{outline:none}
.row{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:6px;
     padding:1px 8px;line-height:1.5;border-radius:4px;cursor:pointer;font-weight:600;user-select:none}
.row.sel{background:var(--sel)}
.row.empty .name{color:var(--mut);font-weight:400}
.tog{text-align:center}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#detail{color:var(--mut);font-size:13px;margin:12px 2px 0;min-height:1.4em;overflow-wrap:anywhere}
.buttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-size:13px;font-weight:600;padding:5px 10px;border-radius:7px;border:1px solid var(--acc);
       background:var(--acc);color:var(--bg);cursor:pointer;white-space:nowrap}
button:disabled{opacity:.35;cursor:default}
progress{width:100%;margin-top:12px}
#msg{margin-top:10px;min-height:1.4em;overflow-wrap:anywhere}
.ok{color:var(--ok)}.bad{color:var(--bad)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}
dt{color:var(--mut)}dd{margin:0;overflow-wrap:anywhere}
#setform{margin-top:14px;display:grid;gap:8px}
#setform label{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:8px;color:var(--mut);font-size:14px}
#setform input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
#setform .hint{color:var(--mut)}
#setform .show{display:flex;align-items:center;gap:4px;font-size:13px}
#devmsg{margin-top:10px;min-height:1.4em;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Apple II WiFi Disk Manager</h1>

<section>
<h2>Image Carousel</h2>
<div id="list" tabindex="0" aria-label="Disk image carousel"></div>
<div class="buttons">
  <button id="download">Download</button>
  <button id="upload">Upload</button>
  <button id="rename">Rename</button>
  <button id="delete">Delete</button>
</div>
<div id="detail"></div>
<input type="file" id="file" accept=".dsk,.do,.woz" hidden>
<progress id="prog" max="1" value="0" hidden></progress>
<div id="msg"></div>
</section>

<section>
<h2>Device</h2>
<p id="setupnote" class="bad" hidden>Setup mode: enter your WiFi network and password below, then Save.
The drive restarts and joins it.</p>
<dl id="dev"></dl>
<form id="setform" autocomplete="off">
  <label>Hostname<input id="f_host" maxlength="63" spellcheck="false"><span class="hint">.local</span></label>
  <label>WiFi network<input id="f_ssid" maxlength="32" spellcheck="false"></label>
  <label>Password<input id="f_pw" type="password" maxlength="63" placeholder="leave blank to keep the current one" autocomplete="new-password"><span class="show"><input type="checkbox" id="f_show">Show</span></label>
</form>
<div class="buttons">
  <button id="setsave" type="button">Save</button>
  <button id="restart">Restart</button>
  <button id="setcancel">Cancel</button>
</div>
<div id="devmsg"></div>
</section>
<p id="err" class="bad"></p>
</main>

<script>
const DSK = 143360, MAX = 262144, ROWS = 10, $ = id => document.getElementById(id);
let rows = Array(ROWS).fill(null), mounted = 0, sel = 0, busy = false, setupMode = false;

const typeLong = {dsk: 'DSK', woz1: 'WOZ 1', woz2: 'WOZ 2'};
const when = t => t ? new Date(t * 1000).toLocaleString() : 'upload time unknown';
function msg(t, cls) { $('msg').textContent = t; $('msg').className = cls || ''; }

function el(tag, text, cls) {
  const d = document.createElement(tag);
  d.textContent = text;
  if (cls) d.className = cls;
  return d;
}

function render() {
  const list = $('list');
  list.replaceChildren();
  rows.forEach((r, i) => {
    const row = el('div', '', 'row' + (i === sel ? ' sel' : '') + (r ? '' : ' empty'));
    // The mount marker is both the state and the control.
    const m = el('div', r ? (i + 1 === mounted ? '●' : '○') : '', 'tog');
    if (r) {
      m.title = i + 1 === mounted ? 'Mounted: click to unmount' : 'Click to mount';
      m.onclick = e => { e.stopPropagation(); sel = i; mount(); };
    }
    row.append(m, el('div', r ? r.name : '<empty>', 'name'));
    row.onclick = () => { sel = i; render(); list.focus(); };
    list.append(row);
  });

  const r = rows[sel], d = $('detail');
  d.replaceChildren();
  if (r)
    d.append(`${r.name} · ${typeLong[r.format] || r.format} · ${when(r.uploaded)} · flash check `,
             el('span', r.verified ? 'OK' : 'MISMATCH', r.verified ? 'ok' : 'bad'));

  // Every button acts only on the selected row.
  $('download').disabled = busy || !r;
  $('upload').disabled = busy;
  $('delete').disabled = busy || !r;
  $('rename').disabled = busy || !r;
  $('restart').disabled = busy;
  formChanged();
}

// The carousel is polled (the OLED buttons and the Apple's writes change
// it); device info only on load and after an operation (Barry: no head
// tracking on the page; the OLED shows it). A Drive row appears only when
// the mounted image can't be served.
async function refresh(full) {
  try {
    const l = await (await fetch('/images', {cache: 'no-store'})).json();
    rows = l.rows; mounted = l.mounted;
    render();
    if (!full) { $('err').textContent = ''; return; }
    const s = await (await fetch('/status', {cache: 'no-store'})).json();
    $('dev').replaceChildren(...[
      ['IP', s.ip || '\u2014'],
      ['Firmware', s.firmware],
      ...(s.drive && s.drive.error ? [['Drive', 'not serving: ' + s.drive.error]] : []),
      ['Stack headroom', s.stack_free + ' bytes'],
      ['Heap headroom', s.heap_headroom + ' bytes'],
    ].flatMap(([k, v]) => [el('dt', k), el('dd', v)]));
    $('err').textContent = '';
    setupMode = !!s.setup_mode;
    if (s.setup_mode && $('setupnote').hidden) {
      $('setupnote').hidden = false;
      $('setupnote').scrollIntoView();
      $('f_ssid').focus();
    }
  } catch (e) {
    $('err').textContent = 'No response from the drive: ' + e.message;
  }
}

async function op(method, url, okText) {
  busy = true; render();
  try {
    const res = await fetch(url, {method});
    const text = await res.text();
    let r = {};
    try { r = JSON.parse(text); } catch {}
    if (res.ok && r.ok !== false) msg(okText, 'ok');     // okText '' = the control shows it; clears an old message
    else msg('Failed: ' + (r.error || text.trim() || 'HTTP ' + res.status), 'bad');
  } catch (e) {
    msg('Failed: ' + e.message, 'bad');
  }
  busy = false;
  await refresh(true);
}

function mount() {
  const r = rows[sel];
  if (busy || !r) return;
  // No success message: the ●/○ change says it (Barry). Failures still show.
  op('POST', sel + 1 === mounted ? '/eject' : `/mount/${sel + 1}`, '');
}

$('download').onclick = () => {
  const r = rows[sel];
  if (!r) return;
  const a = Object.assign(document.createElement('a'), {href: `/image/${sel + 1}`, download: r.name});
  document.body.append(a); a.click(); a.remove();
};

$('rename').onclick = () => {
  const r = rows[sel];
  if (!r || busy) return;
  // The drive keeps the image's file type whatever extension is typed.
  const now = r.name, name = prompt(`New name for ${now}`, now);
  if (name === null || !name.trim() || name.trim() === now) return;
  op('POST', `/rename/${sel + 1}?name=` + encodeURIComponent(name.trim()), `Renamed to ${name.trim()}.`);
};

$('delete').onclick = () => {
  const r = rows[sel];
  if (!r || busy) return;
  if (!confirm(`Delete ${r.name}?` + (sel + 1 === mounted ? ' It is mounted; the drive will be empty.' : '')))
    return;
  op('DELETE', `/image/${sel + 1}`, `Deleted ${r.name}.`);
};

$('upload').onclick = () => { if (!busy) { $('file').value = ''; $('file').click(); } };

$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  const woz = /\.woz$/i.test(f.name);
  if (!woz && f.size !== DSK)
    return msg(`${f.name} is ${f.size.toLocaleString()} bytes; a .dsk image must be exactly ${DSK.toLocaleString()}.`, 'bad');
  if (f.size > MAX)
    return msg(`${f.name} is ${f.size.toLocaleString()} bytes; the drive holds images up to ${MAX.toLocaleString()}.`, 'bad');
  const r = rows[sel], row = sel + 1;
  if (r && !confirm(`Replace ${r.name} with ${f.name}?`)) return;

  busy = true; render();
  const x = new XMLHttpRequest();
  x.open('PUT', `/image/${row}?name=` + encodeURIComponent(f.name));
  $('prog').hidden = false; $('prog').value = 0;
  msg(`Uploading ${f.name}…`);
  x.upload.onprogress = e => { if (e.lengthComputable) $('prog').value = e.loaded / e.total; };
  x.upload.onload = () => msg('Checking and saving…');
  const done = () => { busy = false; $('prog').hidden = true; refresh(true); };
  x.onload = () => {
    let r = {};
    try { r = JSON.parse(x.responseText); } catch {}
    if (x.status === 200 && r.ok) msg(`Stored ${r.name}.`, 'ok');
    else msg('Upload failed: ' + (r.error || x.responseText || 'HTTP ' + x.status), 'bad');
    done();
  };
  x.onerror = () => { msg('Upload failed: connection error', 'bad'); done(); };
  x.send(f);
};

// ---- Device: settings and restart
function devmsg(t, cls) { $('devmsg').textContent = t; $('devmsg').className = cls || ''; }

// After a restart, wait until the drive answers again (same hostname), then reload.
function waitForRestart(text) {
  busy = true; render();
  devmsg(text);
  let seen_down = false, tries = 0;
  const poll = async () => {
    tries++;
    try {
      const s = await (await fetch('/status', {cache: 'no-store'})).json();
      if (seen_down || s.uptime_s < 30) { location.reload(); return; }
    } catch { seen_down = true; }
    if (tries < 60) setTimeout(poll, 2000);
    else devmsg('The drive has not come back yet. Check the LED, or try reloading in a moment.', 'bad');
  };
  setTimeout(poll, 4000);
}

let current = null;     // settings as last read from the drive

async function loadSettings() {
  try {
    current = await (await fetch('/settings', {cache: 'no-store'})).json();
    $('f_host').value = current.hostname;
    $('f_ssid').value = current.ssid;
    $('f_pw').value = '';
    $('f_pw').placeholder = current.password_set ? 'leave blank to keep the current one' : 'none set (open network)';
    formChanged();
  } catch (e) {
    devmsg('Could not read the settings: ' + e.message, 'bad');
  }
}

function edited() {
  return current && ($('f_host').value !== current.hostname ||
                     $('f_ssid').value !== current.ssid || $('f_pw').value !== '');
}

function formChanged() {
  $('setcancel').disabled = busy || !edited();
  $('setsave').disabled = busy || !edited();
}

['f_host', 'f_ssid', 'f_pw'].forEach(id => $(id).oninput = formChanged);
$('f_show').onchange = () => { $('f_pw').type = $('f_show').checked ? 'text' : 'password'; };

// Return moves to the next field; only the Save button saves.
$('setform').onsubmit = e => e.preventDefault();
['f_host', 'f_ssid', 'f_pw'].forEach((id, i, a) => $(id).onkeydown = e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  (i + 1 < a.length ? $(a[i + 1]) : $('setsave')).focus();
});

$('setcancel').onclick = () => { devmsg(''); loadSettings(); };

$('setsave').onclick = async () => {
  const host = $('f_host').value.trim().toLowerCase(), ssid = $('f_ssid').value, pw = $('f_pw').value;
  if (!/^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$/.test(host))
    return devmsg('Hostname: 1 to 63 of a-z, 0-9 and "-", not starting or ending with "-".', 'bad');
  if (ssid.length < 1 || ssid.length > 32)
    return devmsg('WiFi network name: 1 to 32 characters.', 'bad');
  if (pw && (pw.length < 8 || pw.length > 63))
    return devmsg('Password: 8 to 63 characters (or blank to keep the current one).', 'bad');
  if (!confirm(`Save these settings? The drive will restart and join "${ssid}" as ${host}.local.`))
    return;
  busy = true; render();
  try {
    const body = new URLSearchParams({hostname: host, ssid});
    if (pw) body.set('password', pw);
    const res = await fetch('/settings', {method: 'POST', body});
    const text = await res.text();
    let r = {};
    try { r = JSON.parse(text); } catch {}
    $('f_pw').value = '';
    if (!res.ok || r.ok === false) {
      busy = false; render();
      return devmsg('Not saved: ' + (r.error || text.trim() || 'HTTP ' + res.status), 'bad');
    }
    // What the user has to do next depends on where the drive is going.
    const url = `http://${host}.local/`;
    const ssidChanged = ssid !== current.ssid;
    if (setupMode || ssidChanged)
      alert(`Saved. The drive is restarting and will join the WiFi network "${ssid}".\n\n` +
            `Next: set your Mac's WiFi to "${ssid}"` + (setupMode ? ' (leave a2drive-setup)' : '') +
            `, then open ${url} in about 20 seconds.\n\n` +
            'If the drive cannot join, it returns to setup mode within about 2 minutes: ' +
            'join a2drive-setup again and check the network name and password.');
    else if (host !== location.hostname.replace(/\.local$/, ''))
      alert(`Saved. The drive is restarting with its new name.\n\nIn about 20 seconds open ${url}`);
    if (setupMode || ssidChanged || host !== location.hostname.replace(/\.local$/, '')) {
      $('devmsg').replaceChildren('Saved. The drive is restarting; in about 20 seconds open ',
        Object.assign(document.createElement('a'), {href: url, textContent: url}), '.');
      return;
    }
    waitForRestart('Saved. Restarting\u2026');
  } catch (err) {
    busy = false; render();
    devmsg('Not saved: ' + err.message, 'bad');
  }
};

$('restart').onclick = async () => {
  if (busy || !confirm('Restart the drive?')) return;
  try {
    const res = await fetch('/restart', {method: 'POST'});
    if (!res.ok) return devmsg('Restart refused: ' + (await res.text()).trim(), 'bad');
    waitForRestart('Restarting\u2026');
  } catch (e) {
    devmsg('Restart failed: ' + e.message, 'bad');
  }
};

$('list').onkeydown = e => {
  if (e.key === 'ArrowDown') { sel = Math.min(ROWS - 1, sel + 1); render(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); render(); e.preventDefault(); }
};

loadSettings();
refresh(true).then(() => { if (mounted) { sel = mounted - 1; render(); } $('list').focus(); });
setInterval(() => { if (!busy) refresh(); }, 3000);
</script>
</body>
</html>
